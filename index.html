<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI vs Manual Policy Lens</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Inter", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: radial-gradient(1200px 600px at 5% -10%, #e0f2fe 0%, transparent 55%),
                radial-gradient(900px 500px at 95% -10%, #fef3c7 0%, transparent 55%),
                linear-gradient(180deg, #f8fafc 0%, #eef2f7 100%);
            min-height: 100vh;
            padding: 20px;
            color: #0f172a;
            position: relative;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background-image: radial-gradient(rgba(15, 23, 42, 0.08) 1px, transparent 1px);
            background-size: 28px 28px;
            opacity: 0.2;
            pointer-events: none;
            z-index: 0;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        .page-header {
            margin-bottom: 20px;
        }

        .title-block {
            max-width: 760px;
        }

        .page-title {
            color: #042980;
            font-size: 2.2rem;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .page-subtitle {
            color: #475569;
            font-size: 1.05rem;
            line-height: 1.5;
        }

        .metric-indicator {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            padding: 12px 16px;
            min-width: 220px;
            text-align: left;
            box-shadow: 0 6px 18px rgba(15, 23, 42, 0.08);
        }

        .metric-indicator-label {
            text-transform: uppercase;
            letter-spacing: 0.12em;
            font-size: 0.7rem;
            color: #64748b;
            margin-bottom: 6px;
        }

        .metric-indicator-value {
            font-size: 1.1rem;
            font-weight: 700;
            color: #0f172a;
        }

        .metric-overview {
            display: grid;
            grid-template-columns: minmax(180px, 240px) 1fr;
            gap: 16px;
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid #e2e8f0;
            align-items: start;
        }

        .metric-overview .metric-indicator {
            background: #ffffff;
            box-shadow: none;
            padding: 10px 12px;
        }

        .metric-overview .comparison-container {
            margin-bottom: 0;
            gap: 12px;
        }

        .metric-overview .comparison-panel {
            padding: 12px;
            border-width: 1px;
        }

        .metric-overview .comparison-panel-title {
            font-size: 0.95rem;
            margin-bottom: 8px;
            padding-bottom: 6px;
        }

        .metric-overview .section-title {
            font-size: 1.2rem;
            margin-bottom: 10px;
        }

        .metric-overview .stats-grid {
            gap: 10px;
            margin-bottom: 0;
        }

        .metric-overview .stat-card {
            padding: 12px 14px;
            text-align: left;
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            box-shadow: 0 6px 16px rgba(15, 23, 42, 0.06);
        }

        .metric-overview .stat-number {
            font-size: 1.4rem;
        }

        .metric-overview .stat-label {
            font-size: 0.78rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .stat-split {
            font-size: 1.05rem;
            font-weight: 700;
            color: #0f172a;
            margin-top: 6px;
        }

        .stat-split-chatgpt {
            color: #2563eb;
        }

        .stat-split-manual {
            color: #0f766e;
        }

        .stat-split-note {
            font-size: 0.8rem;
            color: #64748b;
            margin-top: 4px;
        }

        .metric-overview .empty-state {
            padding: 20px;
        }

        .metric-overview .empty-state svg {
            width: 60px;
            height: 60px;
            margin-bottom: 12px;
        }

        @media (max-width: 900px) {
            .metric-overview {
                grid-template-columns: 1fr;
            }
        }

        .metric-selector {
            background: white;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 30px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
        }

        .metric-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 10px;
            margin-top: 12px;
        }

        .metric-card {
            padding: 10px 8px;
            /* background: linear-gradient(135deg, #0ea5e9 0%, #38bdf8 100%); */
            color: #4e4e4e;
            border-left: 8px solid #0ea5e9;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 8px rgba(8, 104, 149, 0.1);
        }


        .metric-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 16px rgba(0,0,0,0.2);
        }

        .metric-card.active {
            border-color: #0369a1;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
        }

        .metric-card.disabled {
            opacity: 0.45;
            border-left-color: #9ca3af;
            background: #f3f4f6;
            color: #6b7280;
            cursor: not-allowed;
            box-shadow: none;
            pointer-events: none;
        }

        .metric-card.disabled:hover {
            transform: none;
            box-shadow: none;
        }

        .metric-name {
            text-transform: capitalize;
        }

        .content-container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .tabs {
            display: flex;
            background: #f7f9fc;
            border-bottom: 2px solid #e2e8f0;
        }

        .tab {
            flex: 1;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            font-weight: 600;
            color: #64748b;
            transition: all 0.3s ease;
            border-bottom: 3px solid transparent;
        }

        .tab:hover {
            background: #edf2f7;
            color: #475569;
        }

        .tab.active {
            color: #0ea5e9;
            border-bottom-color: #0ea5e9;
            background: white;
        }

        .tab-content {
            display: none;
            padding: 30px;
            animation: fadeIn 0.3s ease;
        }

        .tab-content.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .section {
            margin-bottom: 30px;
        }

        .section-title {
            color: #1e293b;
            font-size: 1.5rem;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #e2e8f0;
        }

        .card {
            background: #f8fafc;
            border-left: 4px solid #0ea5e9;
            padding: 20px;
            margin-bottom: 15px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 8px rgba(8, 104, 149, 0.1);
        }

        .card:hover {
            box-shadow: 0 4px 12px rgba(14, 165, 233, 0.15);
            transform: translateX(5px);
        }

        .card-title {
            color: #334155;
            font-weight: 700;
            margin-bottom: 10px;
            font-size: 1.1rem;
        }

        .card-note {
            color: #475569;
            line-height: 1.6;
        }

        .tier-section {
            margin-bottom: 25px;
        }

        .tiers-aligned {
            display: flex;
            flex-direction: column;
            gap: 22px;
        }

        .tier-row {
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            background: #ffffff;
            overflow: hidden;
        }

        .tier-row[open] {
            box-shadow: 0 12px 24px rgba(15, 23, 42, 0.08);
        }

        .tier-columns {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            padding: 0 18px 18px;
        }

        .tier-header {
            /* background: linear-gradient(135deg, #0ea5e9 0%, #38bdf8 100%); */
            color: #000000;
            padding: 16px 18px;
            font-size: 1.3rem;
            font-weight: 700;
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 16px;
            cursor: pointer;
            list-style: none;
            border-left: 6px solid #e2e8f0;
            background: #f8fafc;
        }

        .tier-header::-webkit-details-marker {
            display: none;
        }

        .tier-header::marker {
            content: "";
        }

        .tier-header-content {
            display: flex;
            align-items: baseline;
            gap: 12px;
            flex-wrap: wrap;
        }

        .tier-header-title {
            font-weight: 700;
        }

        .tier-header-note {
            font-size: inherit;
            font-weight: 500;
            color: #475569;
        }

        .tier-toggle {
            width: 28px;
            height: 28px;
            border-radius: 999px;
            border: 1px solid #cbd5e1;
            display: grid;
            place-items: center;
            color: #64748b;
            background: #ffffff;
            flex-shrink: 0;
        }

        .tier-toggle::before {
            content: ">";
            font-size: 1rem;
            transform: rotate(0deg);
            transition: transform 0.2s ease;
        }

        .tier-row[open] .tier-toggle::before {
            transform: rotate(90deg);
        }

        .tier-1 { border-left-color: #0ea5e9; }
        .tier-2 { border-left-color: #0ea5e9; }
        .tier-3 { border-left-color: #0ea5e9; }
        .tier-4 { border-left-color: #0ea5e9; }

        .policy-card {
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 10px;
        }

        .policy-name {
            font-weight: 600;
            color: #1e293b;
            margin-bottom: 5px;
        }

        .relationship {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .relationship-met { background: #d1fae5; color: #065f46; }
        .relationship-triggered { background: #fed7aa; color: #92400e; }
        .relationship-violated { background: #fecaca; color: #991b1b; }
        .relationship-other { background: #ddd6fe; color: #5b21b6; }

        .key-elements {
            margin-top: 15px;
            /* padding-left: 20px; */
        }

        .key-element {
            margin-bottom: 10px;
            padding: 10px;
            background: #f1f5f9;
            border-radius: 6px;
        }

        .key-element-name {
            font-weight: 600;
            color: #475569;
            margin-bottom: 5px;
        }

        .agency-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 15px;
        }

        .agency-card {
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 15px;
        }

        .agency-name {
            font-weight: 700;
            color: #1e1e1e;
            margin-bottom: 8px;
            font-size: 1.1rem;
        }

        .loading {
            text-align: center;
            padding: 50px;
            color: #64748b;
            font-size: 1.2rem;
        }

        .empty-state {
            text-align: center;
            padding: 50px;
            color: #94a3b8;
        }

        .empty-state svg {
            width: 100px;
            height: 100px;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        .search-box {
            width: 100%;
            padding: 12px 20px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 1rem;
            margin-bottom: 20px;
            transition: border-color 0.3s ease;
        }

        .search-box:focus {
            outline: none;
            border-color: #0ea5e9;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-card {
            /* background: linear-gradient(135deg, #0ea5e9 0%, #38bdf8 100%); */
            /* border-bottom: 2px solid #0ea5e9; */
            color: #1e293b;
            padding: 20px;
            text-align: center;
        }

        .stat-number {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 0.9rem;
            opacity: 0.9;
        }

        .comparison-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .comparison-panel {
            background: #f8fafc;
            border-radius: 8px;
            padding: 20px;
            border: 2px solid #e2e8f0;
        }

        .comparison-panel-title {
            font-size: 1.2rem;
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #0ea5e9;
        }

        .panel-count {
            color: #94a3b8;
            font-weight: 600;
        }

        .error-display {
            background: #fee2e2;
            border: 2px solid #fecaca;
            color: #991b1b;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            font-weight: 600;
        }

        .is-hidden {
            display: none;
        }

        @media (max-width: 1024px) {
            .comparison-container {
                grid-template-columns: 1fr;
            }

            .tier-columns {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="page-header">
            <div class="title-block">
                <div class="page-title">AI vs Manual Policy Lens</div>
                <!-- <div class="page-subtitle">Side-by-side application of the framework to surface blind spots and capture signals experts might miss.</div> -->
            </div>
        </header>
        
        <div class="metric-selector">
            <h2 style="margin-bottom: 15px; color: #1e293b;">Select a Metric</h2>
            <div class="metric-grid" id="metricGrid"></div>
            <div class="metric-overview">
                <div class="metric-indicator">
                    <div class="metric-indicator-label">Selected Metric</div>
                    <div class="metric-indicator-value" id="selectedMetric">None</div>
                </div>
                <div id="overviewInline" class="overview-inline"></div>
            </div>
        </div>

        <div class="content-container">
            <div class="tabs">
                <div class="tab active" data-tab="legal">Legal Standards</div>
                <div class="tab" data-tab="tiers">Tiered Implications</div>
                <div class="tab" data-tab="agencies">Agencies</div>
            </div>

            <div id="legal" class="tab-content active">
                <div id="legalEmptyState" class="empty-state">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                    </svg>
                    <h2>Select a metric to view analysis</h2>
                    <p>Choose from the options above to explore policy data</p>
                </div>
                <div id="legalComparison" class="comparison-container is-hidden">
                    <div class="comparison-panel">
                        <div class="comparison-panel-title">ChatGPT Results <span class="panel-count" id="legalCountChatGPT">(0)</span></div>
                        <div id="legalContentChatGPT"></div>
                    </div>
                    <div class="comparison-panel">
                        <div class="comparison-panel-title">Manual Results <span class="panel-count" id="legalCountManual">(0)</span></div>
                        <div id="legalContentManual"></div>
                    </div>
                </div>
            </div>

            <div id="tiers" class="tab-content">
                <div id="tiersAligned" class="tiers-aligned"></div>
            </div>

            <div id="agencies" class="tab-content">
                <div class="comparison-container">
                    <div class="comparison-panel">
                        <div class="comparison-panel-title">ChatGPT Results <span class="panel-count" id="agenciesCountChatGPT">(0)</span></div>
                        <div id="agenciesContentChatGPT"></div>
                    </div>
                    <div class="comparison-panel">
                        <div class="comparison-panel-title">Manual Results <span class="panel-count" id="agenciesCountManual">(0)</span></div>
                        <div id="agenciesContentManual"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const metrics = [
            'agricultural_productivity',
            'bay_delta_estuary_ecology',
            'delta_freshwater_export',
            'environmental_flows',
            'freshwater_in_delta',
            'groundwater_storage',
            'resevoir_storage',
            'salmon_abundance'
        ];
        const allowedMetric = 'agricultural_productivity';

        let currentMetric = null;
        let currentData = null;
        let currentDataChatGPT = null;
        let currentDataManual = null;

        // Initialize
        function init() {
            renderMetricCards();
            setupTabListeners();
        }

        function renderMetricCards() {
            const grid = document.getElementById('metricGrid');
            grid.innerHTML = metrics.map(metric => {
                // const isAllowed = metric === allowedMetric;
                const isAllowed = true; // Allow all metrics for selection
                const disabledClass = isAllowed ? '' : 'disabled';
                const clickHandler = isAllowed ? `onclick="selectMetric('${metric}')"` : '';
                return `
                <div class="metric-card ${disabledClass}" data-metric="${metric}" ${clickHandler} aria-disabled="${!isAllowed}">
                    <div class="metric-name">${formatMetricName(metric)}</div>
                </div>
            `;
            }).join('');
        }

        function formatMetricName(metric) {
            return metric.replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
        }

        async function selectMetric(metric) {
            // if (metric !== allowedMetric) {
            //     return;
            // }
            // Update active state
            document.querySelectorAll('.metric-card').forEach(card => {
                card.classList.toggle('active', card.dataset.metric === metric);
            });

            currentMetric = metric;
            const selectedMetric = document.getElementById('selectedMetric');
            if (selectedMetric) {
                selectedMetric.textContent = formatMetricName(metric);
            }
            
            // Load both datasets
            try {
                const [chatgptResponse, manualResponse] = await Promise.all([
                    fetch(`chatgpt_responses/${metric}.json`),
                    fetch(`manual_responses/${metric}.json`)
                ]);
                
                currentDataChatGPT = await chatgptResponse.json();
                currentDataManual = await manualResponse.json();
                currentData = currentDataChatGPT; // For overview compatibility
                
                renderOverview();
                renderLegalStandards();
                renderTiers();
                renderAgencies();
            } catch (error) {
                console.error('Error loading data:', error);
                alert('Error loading data for ' + formatMetricName(metric));
            }
        }

        function setupTabListeners() {
            document.querySelectorAll('.tab').forEach(tab => {
                tab.addEventListener('click', () => {
                    const tabName = tab.dataset.tab;
                    
                    // Update active tab
                    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                    tab.classList.add('active');
                    
                    // Update active content
                    document.querySelectorAll('.tab-content').forEach(content => {
                        content.classList.remove('active');
                    });
                    document.getElementById(tabName).classList.add('active');
                });
            });
        }

        function renderOverview() {
            if (!currentDataChatGPT && !currentDataManual) return;

            const getStats = (data) => {
                const legalCount = data['Legal Standards']?.length || 0;
                const tierCount = Object.keys(data.Tiers || {}).length;
                const agencyCount = data['Governing Agencies']?.length || 0;
                
                let totalPolicies = 0;
                Object.values(data.Tiers || {}).forEach(tier => {
                    totalPolicies += tier.length;
                });

                return { legalCount, tierCount, agencyCount, totalPolicies };
            };

            const chatgptStats = getStats(currentDataChatGPT || {});
            const manualStats = getStats(currentDataManual || {});

            document.getElementById('overviewInline').innerHTML = `
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-label">Legal Standards</div>
                        <div class="stat-split"><span class="stat-split-chatgpt">ChatGPT +${chatgptStats.legalCount}</span> / <span class="stat-split-manual">Manual +${manualStats.legalCount}</span></div>
                        <div class="stat-split-note">Count of legal standards identified</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">Tiered Implications</div>
                        <div class="stat-split"><span class="stat-split-chatgpt">ChatGPT +${chatgptStats.totalPolicies}</span> / <span class="stat-split-manual">Manual +${manualStats.totalPolicies}</span></div>
                        <div class="stat-split-note">Count of policy implications across tiers</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">Agencies</div>
                        <div class="stat-split"><span class="stat-split-chatgpt">ChatGPT +${chatgptStats.agencyCount}</span> / <span class="stat-split-manual">Manual +${manualStats.agencyCount}</span></div>
                        <div class="stat-split-note">Governing agencies listed</div>
                    </div>
                </div>
            `;
        }

        function renderLegalStandards() {
            if (!currentDataChatGPT || !currentDataManual) return;

            const legalEmptyState = document.getElementById('legalEmptyState');
            const legalComparison = document.getElementById('legalComparison');
            if (legalEmptyState && legalComparison) {
                legalEmptyState.classList.add('is-hidden');
                legalComparison.classList.remove('is-hidden');
            }

            const legalCountChatGPT = document.getElementById('legalCountChatGPT');
            const legalCountManual = document.getElementById('legalCountManual');
            if (legalCountChatGPT) {
                legalCountChatGPT.textContent = `(${currentDataChatGPT['Legal Standards']?.length || 0})`;
            }
            if (legalCountManual) {
                legalCountManual.textContent = `(${currentDataManual['Legal Standards']?.length || 0})`;
            }

            renderLegalStandardsPanel(currentDataChatGPT, 'ChatGPT');
            renderLegalStandardsPanel(currentDataManual, 'Manual');
        }

        function renderLegalStandardsPanel(data, source) {
            if (!data['Legal Standards']) {
                const elementId = source === 'ChatGPT' ? 'legalContentChatGPT' : 'legalContentManual';
                document.getElementById(elementId).innerHTML = '<div class="error-display">Error: Missing Legal Standards</div>';
                return;
            }

            const standards = data['Legal Standards'];
            const elementId = source === 'ChatGPT' ? 'legalContentChatGPT' : 'legalContentManual';
            const content = document.getElementById(elementId);
            
            content.innerHTML = standards.map(standard => `
                <div class="card">
                    <div class="card-title">${standard.name || '<span class="error-display" style="display: inline; padding: 2px 6px;">Error</span>'}</div>
                    <div class="card-note">${standard.note || '<span class="error-display" style="display: inline; padding: 2px 6px;">Error</span>'}</div>
                    ${standard.key_elements && standard.key_elements.length > 0 ? `
                        <div class="key-elements">
                            <strong>Key Elements:</strong>
                            <ul style="margin-top: 10px; margin-left: 20px;">
                                ${standard.key_elements.map(elem => {
                                    const entries = Object.entries(elem);
                                    return `<li style="margin-bottom: 8px;">${entries.map(([key, value]) => 
                                        `<strong>${key}:</strong> ${typeof value === 'object' ? JSON.stringify(value, null, 2) : value}`
                                    ).join('<br>')}</li>`;
                                }).join('')}
                            </ul>
                        </div>
                    ` : ''}
                </div>
            `).join('');
        }

        function renderTiers() {
            if (!currentDataChatGPT && !currentDataManual) return;
            const tierOrder = ['Tier 1', 'Tier 2', 'Tier 3', 'Tier 4'];
            const tierDefinitions = {
                'Tier 1': 'Revenue Increasing',
                'Tier 2': 'Revenue Declining &lt;5%/year',
                'Tier 3': 'Revenue Declining 5-20%/year',
                'Tier 4': 'Revenue Declining &gt;20%/year'
            };
            const content = document.getElementById('tiersAligned');
            const chatgptTiers = currentDataChatGPT && currentDataChatGPT.Tiers ? currentDataChatGPT.Tiers : null;
            const manualTiers = currentDataManual && currentDataManual.Tiers ? currentDataManual.Tiers : null;

            content.innerHTML = tierOrder.map((tierName) => {
                const tierNumber = tierName.split(' ')[1];
                const chatPolicies = chatgptTiers ? chatgptTiers[tierName] : null;
                const manualPolicies = manualTiers ? manualTiers[tierName] : null;
                const tierDefinition = tierDefinitions[tierName];
                const chatCount = Array.isArray(chatPolicies) ? chatPolicies.length : 0;
                const manualCount = Array.isArray(manualPolicies) ? manualPolicies.length : 0;

                return `
                    <details class="tier-row" open>
                        <summary class="tier-header tier-${tierNumber}">
                            <span class="tier-header-content">
                                <span class="tier-header-title">${tierName}</span>
                                ${tierDefinition ? `<span class="tier-header-note">&mdash; ${tierDefinition}</span>` : ''}
                            </span>
                            <span class="tier-toggle" aria-hidden="true"></span>
                        </summary>
                        <div class="tier-columns">
                            <div class="comparison-panel">
                                <div class="comparison-panel-title">ChatGPT Results <span class="panel-count">(${chatCount})</span></div>
                                ${chatPolicies ? renderTierPolicies(chatPolicies, tierNumber) : '<div class="error-display">Error: Missing Tier</div>'}
                            </div>
                            <div class="comparison-panel">
                                <div class="comparison-panel-title">Manual Results <span class="panel-count">(${manualCount})</span></div>
                                ${manualPolicies ? renderTierPolicies(manualPolicies, tierNumber) : '<div class="error-display">Error: Missing Tier</div>'}
                            </div>
                        </div>
                    </details>
                `;
            }).join('');
        }

        function renderTierPolicies(policies, tierNumber) {
            if (!Array.isArray(policies) || policies.length === 0) {
                return '<div class="empty-state"><h3>No policy data available for this tier</h3></div>';
            }

            return policies.map(policy => `
                <div class="policy-card tier-${tierNumber}">
                    <div class="policy-name">${policy.policy_name || '<span class="error-display" style="display: inline; padding: 2px 6px;">Error</span>'}</div>
                    ${policy.relationship ? `<div class="relationship ${getRelationshipClass(policy.relationship)}">${policy.relationship}</div>` : '<div class="error-display" style="padding: 4px 12px; display: inline-block; font-size: 0.85rem;">Error: Missing relationship</div>'}
                    <div class="card-note">${policy.note || '<span class="error-display" style="display: inline; padding: 2px 6px;">Error</span>'}</div>
                </div>
            `).join('');
        }

        function getRelationshipClass(relationship) {
            const rel = relationship.toLowerCase();
            if (rel.includes('met') || rel.includes('aligned') || rel.includes('supported')) {
                return 'relationship-met';
            } else if (rel.includes('triggered') || rel.includes('watched')) {
                return 'relationship-triggered';
            } else if (rel.includes('violated') || rel.includes('noncompliant') || rel.includes('at-risk')) {
                return 'relationship-violated';
            }
            return 'relationship-other';
        }

        function renderAgencies() {
            if (!currentDataChatGPT && !currentDataManual) return;

            const agenciesCountChatGPT = document.getElementById('agenciesCountChatGPT');
            const agenciesCountManual = document.getElementById('agenciesCountManual');
            if (agenciesCountChatGPT) {
                agenciesCountChatGPT.textContent = `(${currentDataChatGPT && currentDataChatGPT['Governing Agencies'] ? currentDataChatGPT['Governing Agencies'].length : 0})`;
            }
            if (agenciesCountManual) {
                agenciesCountManual.textContent = `(${currentDataManual && currentDataManual['Governing Agencies'] ? currentDataManual['Governing Agencies'].length : 0})`;
            }

            if (currentDataChatGPT && currentDataChatGPT['Governing Agencies']) {
                renderAgenciesPanel(currentDataChatGPT, 'ChatGPT');
            } else {
                document.getElementById('agenciesContentChatGPT').innerHTML = '<div class="error-display">Error: No agency data</div>';
            }

            if (currentDataManual && currentDataManual['Governing Agencies']) {
                renderAgenciesPanel(currentDataManual, 'Manual');
            } else {
                document.getElementById('agenciesContentManual').innerHTML = '<div class="error-display">Error: No agency data</div>';
            }
        }

        function renderAgenciesPanel(data, source) {
            const agencies = data['Governing Agencies'] || [];
            const elementId = source === 'ChatGPT' ? 'agenciesContentChatGPT' : 'agenciesContentManual';
            const content = document.getElementById(elementId);
            
            if (agencies.length === 0) {
                content.innerHTML = `
                    <div class="empty-state">
                        <h3>No agency data available for this metric</h3>
                    </div>
                `;
                return;
            }

            content.innerHTML = `
                <div class="agency-grid">
                    ${agencies.map(agency => `
                        <div class="agency-card">
                            <div class="agency-name">${agency.name || '<span class="error-display" style="display: inline; padding: 2px 6px;">Error</span>'}</div>
                            <div class="card-note">${agency.note || '<span class="error-display" style="display: inline; padding: 2px 6px;">Error</span>'}</div>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        // Initialize on load
        init();
    </script>
</body>
</html>
